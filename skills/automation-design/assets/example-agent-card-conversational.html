<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent card · conversational · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #7a8399; --rule: rgba(45,49,66,0.12); --accent: #eb6c36; --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1120px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; font: 400 2rem/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; }
    .tag-text { fill: var(--muted); font: 600 6px var(--mono); text-anchor: middle; letter-spacing: 0.06em; }
    .io-chip { fill: var(--ink); font: 600 6px var(--mono); text-anchor: middle; letter-spacing: 0.10em; }
    .auto-chip { fill: var(--accent); font: 600 6px var(--mono); text-anchor: middle; letter-spacing: 0.06em; }
    .node-title { fill: var(--ink); font: 600 10px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; letter-spacing: 0.06em; }
    .link-label { fill: var(--link); }
    .boundary-label { fill: var(--accent); font: 500 7px var(--mono); letter-spacing: 0.14em; }
    .ground-label { fill: var(--muted); font: 500 7px var(--mono); letter-spacing: 0.14em; }
    .panel-eyebrow { fill: var(--muted); font: 500 7px var(--mono); letter-spacing: 0.14em; }
    .panel-line { fill: var(--soft); font: 400 7px var(--mono); }
    .legend-label { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
    .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
    .focal-text { fill: var(--accent); }
    .colophon { margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--rule); color: var(--soft); font: 400 0.62rem var(--mono); letter-spacing: 0.08em; }
    .colophon a { color: var(--muted); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · agent card · conversational · Automation Design</p>
    <h1>Support Chat Agent</h1>

    <svg viewBox="0 0 1040 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-card-conversational-title agent-card-conversational-desc">
      <title id="agent-card-conversational-title">Support Chat Agent — conversational agent card</title>
      <desc id="agent-card-conversational-desc">Conversational agent card: a user query enters, the agent grounds each answer in the help center and CRM, acts through permitted tools, and returns a sourced answer; low confidence hands the session to a human agent.</desc>
      <defs>
        <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="arr-ink" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2d3142"/></marker>
        <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#eb6c36"/></marker>
      </defs>
      <rect width="1040" height="600" fill="#f5f5f5"/>

      <!-- Page-context panel -->
      <rect x="40" y="16" width="640" height="80" rx="6" fill="#ececec" stroke="rgba(45,49,66,0.12)"/>
      <text x="52" y="34" class="panel-eyebrow">AGENT CARD</text>
      <text x="52" y="48" class="panel-line">CHARTER · answers customer order and billing questions in the chat widget</text>
      <text x="52" y="60" class="panel-line">MODE · CONV — human in the loop each session · turn-based</text>
      <text x="52" y="72" class="panel-line">GUARDRAILS · every answer carries its source · no payment data in replies</text>

      <!-- Containers first -->
      <rect x="104" y="336" width="200" height="176" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-dasharray="4,4"/>
      <text x="120" y="356" class="ground-label">CONTEXT GROUNDING · 2</text>
      <rect x="712" y="336" width="264" height="176" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-dasharray="4,4"/>
      <text x="728" y="356" class="boundary-label">TOOL PERMISSIONS · 2 OF 2</text>

      <!-- Connectors -->
      <!-- I/O spine -->
      <path d="M168 216 H440" fill="none" stroke="#2d3142" marker-end="url(#arr-ink)"/>
      <path d="M600 216 H872" fill="none" stroke="#2d3142" marker-end="url(#arr-ink)"/>
      <!-- LLM -->
      <path d="M520 188 V160" fill="none" stroke="#2e5aa8" marker-end="url(#arr-link)"/>
      <!-- grounding: sources up into agent left edge -->
      <path d="M244 392 H316 Q324 392 324 384 V244 Q324 236 332 236 H440" fill="none" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#arr)"/>
      <path d="M244 464 H344 Q352 464 352 456 V264 Q352 256 360 256 H440" fill="none" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#arr)"/>
      <!-- tools: agent right edge down into the boundary -->
      <path d="M600 236 H680 Q688 236 688 244 V384 Q688 392 696 392 H736" fill="none" stroke="#2e5aa8" marker-end="url(#arr-link)"/>
      <path d="M600 256 H656 Q664 256 664 264 V456 Q664 464 672 464 H736" fill="none" stroke="#2e5aa8" marker-end="url(#arr-link)"/>
      <!-- escalation -->
      <path d="M520 268 V424" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr-accent)"/>

      <!-- Guardrail gate on the send edge (sits on the vertical run of the second tool call) -->
      <rect x="656" y="308" width="16" height="16" rx="3" fill="#f5f5f5" stroke="#7a8399"/>
      <text x="664" y="320" class="tag-text">◉</text>
      <rect x="628" y="332" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="664" y="341" class="arrow-label">CONSENT</text>

      <!-- Arrow labels -->
      <rect x="248" y="196" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="205" class="arrow-label">QUERY</text>
      <rect x="708" y="196" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="732" y="205" class="arrow-label">ANSWER</text>
      <rect x="484" y="164" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="173" class="arrow-label link-label">PROMPT</text>
      <rect x="364" y="216" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="394" y="225" class="arrow-label">RETRIEVE</text>
      <rect x="608" y="272" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="281" class="arrow-label link-label">TOOL CALL</text>
      <rect x="528" y="296" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="305" class="arrow-label focal-text">ESCALATE</text>

      <!-- IN node -->
      <rect x="40" y="188" width="128" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
      <rect x="46" y="194" width="20" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="56" y="201" class="io-chip">IN</text>
      <text x="104" y="216" class="node-title">User query</text>
      <text x="104" y="230" class="node-sub">chat widget · per turn</text>

      <!-- LLM -->
      <rect x="460" y="112" width="120" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
      <rect x="466" y="118" width="24" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="478" y="125" class="tag-text">LLM</text>
      <text x="520" y="138" class="node-title">Reasoning model</text>
      <text x="520" y="150" class="node-sub">provider in sublabel</text>

      <!-- AGENT (focal) -->
      <rect x="440" y="188" width="160" height="80" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="448" y="194" width="44" height="10" rx="3" fill="rgba(235,108,54,0.20)"/><text x="470" y="201" class="auto-chip">✦ AGENT</text>
      <rect x="548" y="194" width="36" height="10" rx="3" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/><text x="566" y="201" class="auto-chip">CONV</text>
      <text x="520" y="224" class="node-title">Support Chat Agent</text>
      <text x="520" y="238" class="node-sub">grounded answers · per-turn loop</text>
      <text x="520" y="250" class="node-sub">conf &lt; 70% → human takes over</text>

      <!-- OUT node -->
      <rect x="872" y="188" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <rect x="878" y="194" width="24" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="890" y="201" class="io-chip">OUT</text>
      <text x="936" y="216" class="node-title">Answer</text>
      <text x="936" y="230" class="node-sub">+ source link · per turn</text>

      <!-- Grounding sources -->
      <rect x="124" y="368" width="120" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
      <rect x="128" y="372" width="24" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="140" y="379" class="tag-text">KB</text>
      <text x="184" y="392" class="node-title">Help center</text>
      <text x="184" y="404" class="node-sub">grounding index · articles</text>

      <rect x="124" y="440" width="120" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
      <rect x="128" y="444" width="24" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="140" y="451" class="tag-text">APP</text>
      <text x="184" y="464" class="node-title">CRM · read only</text>
      <text x="184" y="476" class="node-sub">orders · customer profile</text>

      <!-- Tools -->
      <rect x="736" y="368" width="216" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
      <rect x="740" y="372" width="24" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="752" y="379" class="tag-text">API</text>
      <text x="844" y="392" class="node-title">Order status lookup</text>
      <text x="844" y="404" class="node-sub">GET /orders/{id}</text>

      <rect x="736" y="440" width="216" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
      <rect x="740" y="444" width="28" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="754" y="451" class="tag-text">APP</text>
      <text x="844" y="464" class="node-title">Create support ticket</text>
      <text x="844" y="476" class="node-sub">helpdesk · with transcript</text>

      <!-- Escalation target -->
      <rect x="440" y="424" width="160" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
      <rect x="448" y="430" width="48" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="472" y="437" class="tag-text">◉ HUMAN</text>
      <text x="520" y="452" class="node-title">Human agent</text>
      <text x="520" y="464" class="node-sub">takes over the session</text>

      <!-- Legend -->
      <line x1="40" y1="536" x2="1000" y2="536" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" class="legend-label">LEGEND</text>
      <line x1="120" y1="552" x2="160" y2="552" stroke="#2d3142"/><text x="168" y="555" class="legend-text">I/O spine (in → agent → out)</text>
      <line x1="328" y1="552" x2="368" y2="552" stroke="#4f5d75" stroke-dasharray="5,4"/><text x="376" y="555" class="legend-text">Grounding (reads)</text>
      <line x1="488" y1="552" x2="528" y2="552" stroke="#2e5aa8"/><text x="536" y="555" class="legend-text">Tool / LLM call (acts)</text>
      <line x1="656" y1="552" x2="696" y2="552" stroke="#eb6c36" stroke-dasharray="5,4"/><text x="704" y="555" class="legend-text">Escalation</text>
      <rect x="792" y="545" width="16" height="14" rx="3" fill="#f5f5f5" stroke="#7a8399"/><text x="800" y="556" class="tag-text">◉</text><text x="816" y="555" class="legend-text">Guardrail gate</text>
    </svg>

    <p class="colophon">agent card · standalone example — in a detail set this page carries numbering and parent links</p>
  </main>
</body>
</html>
