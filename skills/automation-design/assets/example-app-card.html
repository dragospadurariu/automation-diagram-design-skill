<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App card · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #7a8399; --rule: rgba(45,49,66,0.12); --accent: #eb6c36; --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1120px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; font: 400 2rem/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; }
    .tag-text { fill: var(--muted); font: 600 6px var(--mono); text-anchor: middle; letter-spacing: 0.06em; }
    .io-chip { fill: var(--ink); font: 600 6px var(--mono); text-anchor: middle; letter-spacing: 0.10em; }
    .app-chip { fill: var(--accent); font: 600 6px var(--mono); text-anchor: middle; letter-spacing: 0.06em; }
    .node-title { fill: var(--ink); font: 600 10px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; letter-spacing: 0.06em; }
    .link-label { fill: var(--link); }
    .boundary-label { fill: var(--accent); font: 500 7px var(--mono); letter-spacing: 0.14em; }
    .ground-label { fill: var(--muted); font: 500 7px var(--mono); letter-spacing: 0.14em; }
    .panel-eyebrow { fill: var(--muted); font: 500 7px var(--mono); letter-spacing: 0.14em; }
    .panel-line { fill: var(--soft); font: 400 7px var(--mono); }
    .legend-label { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
    .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
    .focal-text { fill: var(--accent); }
    .colophon { margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--rule); color: var(--soft); font: 400 0.62rem var(--mono); letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · application card · functional view · Automation Design</p>
    <h1>Invoice Portal</h1>

    <svg viewBox="0 0 1040 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="app-card-title app-card-desc">
      <title id="app-card-title">Invoice Portal — app card</title>
      <desc id="app-card-desc">Functional application context: users enter through an SSO gate, the app reads and writes its system of record and reads vendor master data, approval emits a decision event, and side effects run as commands in the automation boundary.</desc>
      <defs>
        <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="arr-ink" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2d3142"/></marker>
        <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1040" height="600" fill="#f5f5f5"/>

      <!-- Page-context panel -->
      <rect x="40" y="16" width="656" height="80" rx="6" fill="#ececec" stroke="rgba(45,49,66,0.12)"/>
      <text x="52" y="34" class="panel-eyebrow">APP CARD · FUNCTIONAL VIEW</text>
      <text x="52" y="48" class="panel-line">PURPOSE · AP clerks review, correct, and approve incoming vendor invoices</text>
      <text x="52" y="60" class="panel-line">USERS · AP clerk (12) · AP lead (2) — role-based access · SCREENS · 3 + 2 modals</text>
      <text x="52" y="72" class="panel-line">PROFILE · Power Apps · Dataverse · Power Automate — the card itself is platform-neutral;</text>
      <text x="52" y="84" class="panel-line">a pro-code profile (Next.js) adds a technical/deployment annex</text>

      <!-- Containers first -->
      <rect x="104" y="336" width="200" height="176" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-dasharray="4,4"/>
      <text x="120" y="356" class="ground-label">DATA · 2 ENTITIES</text>
      <rect x="712" y="336" width="264" height="176" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-dasharray="4,4"/>
      <text x="728" y="356" class="boundary-label">AUTOMATIONS · BY EVENT</text>

      <!-- Connectors -->
      <!-- user spine -->
      <path d="M168 216 H440" fill="none" stroke="#2d3142" marker-end="url(#arr-ink)"/>
      <path d="M600 216 H872" fill="none" stroke="#2d3142" marker-end="url(#arr-ink)"/>
      <!-- identity provider above -->
      <path d="M520 188 V160" fill="none" stroke="#2e5aa8" marker-end="url(#arr-link)"/>
      <!-- data: Invoices READ (into app) + WRITE (from app), Vendors READ only -->
      <path d="M244 384 H316 Q324 384 324 376 V236 Q324 228 332 228 H440" fill="none" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#arr)"/>
      <path d="M440 240 H348 Q340 240 340 248 V396 Q340 404 332 404 H244" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <path d="M244 464 H364 Q372 464 372 456 V260 Q372 252 380 252 H440" fill="none" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#arr)"/>
      <!-- automations: app right edge down into the boundary -->
      <path d="M600 236 H680 Q688 236 688 244 V384 Q688 392 696 392 H736" fill="none" stroke="#2e5aa8" marker-end="url(#arr-link)"/>
      <path d="M600 256 H656 Q664 256 664 264 V456 Q664 464 672 464 H736" fill="none" stroke="#2e5aa8" marker-end="url(#arr-link)"/>

      <!-- SSO gate on the user edge -->
      <rect x="280" y="208" width="16" height="16" rx="3" fill="#f5f5f5" stroke="#7a8399"/>
      <text x="288" y="220" class="tag-text">⚙</text>
      <rect x="264" y="184" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="288" y="193" class="arrow-label">SSO</text>

      <!-- Arrow labels -->
      <rect x="188" y="184" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="212" y="193" class="arrow-label">USES</text>
      <rect x="704" y="196" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="732" y="205" class="arrow-label">APPROVES</text>
      <rect x="464" y="164" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="488" y="173" class="arrow-label link-label">AUTH</text>
      <rect x="268" y="300" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="292" y="309" class="arrow-label">READ</text>
      <rect x="252" y="412" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="276" y="421" class="arrow-label">WRITE</text>
      <rect x="384" y="276" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="408" y="285" class="arrow-label">READ</text>
      <rect x="592" y="272" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="624" y="281" class="arrow-label link-label">COMMAND</text>

      <!-- IN: users -->
      <rect x="40" y="188" width="128" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
      <rect x="46" y="194" width="48" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="70" y="201" class="io-chip">◉ USERS</text>
      <text x="104" y="216" class="node-title">AP clerk · AP lead</text>
      <text x="104" y="230" class="node-sub">browser · role-gated</text>

      <!-- Identity provider -->
      <rect x="460" y="112" width="120" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
      <rect x="466" y="118" width="28" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="480" y="125" class="tag-text">AUTH</text>
      <text x="520" y="138" class="node-title">Identity provider</text>
      <text x="520" y="150" class="node-sub">hosted sign-in · role claims</text>

      <!-- THE APP (focal) -->
      <rect x="440" y="188" width="160" height="80" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="448" y="194" width="36" height="10" rx="3" fill="rgba(235,108,54,0.20)"/><text x="466" y="201" class="app-chip">APP</text>
      <rect x="548" y="194" width="36" height="10" rx="3" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/><text x="566" y="201" class="app-chip">WEB</text>
      <text x="520" y="224" class="node-title">Invoice Portal</text>
      <text x="520" y="238" class="node-sub">3 screens + 2 modals</text>
      <text x="520" y="250" class="node-sub">canvas app · per profile</text>

      <!-- OUT: decision event -->
      <rect x="872" y="188" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <rect x="878" y="194" width="24" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="890" y="201" class="io-chip">OUT</text>
      <text x="936" y="216" class="node-title">Invoice approved</text>
      <text x="936" y="230" class="node-sub">decision event · audited</text>

      <!-- Data entities -->
      <rect x="124" y="368" width="120" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
      <rect x="128" y="372" width="36" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="146" y="379" class="tag-text">ENTITY</text>
      <text x="184" y="392" class="node-title">Invoices</text>
      <text x="184" y="404" class="node-sub">RW · system of record</text>

      <rect x="124" y="440" width="120" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
      <rect x="128" y="444" width="36" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="146" y="451" class="tag-text">ENTITY</text>
      <text x="184" y="464" class="node-title">Vendors</text>
      <text x="184" y="476" class="node-sub">read only · master data</text>

      <!-- Automations -->
      <rect x="736" y="368" width="216" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
      <rect x="740" y="372" width="28" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="754" y="379" class="tag-text">RPA</text>
      <text x="844" y="392" class="node-title">Post to ERP</text>
      <text x="844" y="404" class="node-sub">PostInvoice command · queued</text>

      <rect x="736" y="440" width="216" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
      <rect x="740" y="444" width="28" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="754" y="451" class="tag-text">FLOW</text>
      <text x="844" y="464" class="node-title">Notify AP lead</text>
      <text x="844" y="476" class="node-sub">cloud flow · on reject</text>

      <!-- Legend -->
      <line x1="40" y1="536" x2="1000" y2="536" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" class="legend-label">LEGEND</text>
      <line x1="120" y1="552" x2="160" y2="552" stroke="#2d3142"/><text x="168" y="555" class="legend-text">User → app → outcome spine</text>
      <line x1="336" y1="552" x2="376" y2="552" stroke="#4f5d75" stroke-dasharray="5,4"/><text x="384" y="555" class="legend-text">Data read (write solid)</text>
      <line x1="504" y1="552" x2="544" y2="552" stroke="#2e5aa8"/><text x="552" y="555" class="legend-text">Command / auth call</text>
      <rect x="664" y="545" width="16" height="14" rx="3" fill="#f5f5f5" stroke="#7a8399"/><text x="672" y="556" class="tag-text">⚙</text><text x="688" y="555" class="legend-text">Gate on the edge (SSO · automated)</text>
      <rect x="880" y="545" width="28" height="14" rx="3" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-dasharray="4,4"/><text x="916" y="555" class="legend-text">Automation boundary</text>
    </svg>

    <p class="colophon">app card · standalone example — in a detail set this page carries numbering and parent links</p>
  </main>
</body>
</html>
