<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPA solution blueprint · Flowchart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #7a8399; --rule: rgba(45,49,66,0.12); --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 960px; }
    .phase-label, .tag-text, .arrow-label, .legend-label { font-family: var(--mono); }
    .phase-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
    .tag-text { fill: var(--muted); font-size: 6px; font-weight: 600; text-anchor: middle; letter-spacing: 0.06em; }
    .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
    .terminal-text { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
    .decision-text { fill: var(--ink); font: 600 8px var(--sans); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font-size: 8px; text-anchor: middle; letter-spacing: 0.06em; }
    .focal-text { fill: var(--accent); }
    .legend-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
    .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Flowchart · RPA solution blueprint · Automation Design</p>
    <h1>Document intake automation — solution blueprint</h1>

    <svg viewBox="0 0 1200 348" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rpa-blueprint-title rpa-blueprint-desc">
      <title id="rpa-blueprint-title">Document intake automation solution blueprint</title>
      <desc id="rpa-blueprint-desc">Three named processes: a mail-intake robot fetches emails and saves attachments; document understanding digitizes, classifies, and extracts fields with a human validation branch; accepted results wait in a queue until a performer posts them into the target application.</desc>
      <defs>
        <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#eb6c36"/></marker>
      </defs>
      <rect width="1200" height="348" fill="#f5f5f5"/>

      <!-- Phase labels + dashed dividers -->
      <text x="40" y="56" class="phase-label">PROCESS 1 · MAIL INTAKE</text>
      <text x="392" y="56" class="phase-label">PROCESS 2 · DOCUMENT UNDERSTANDING</text>
      <text x="992" y="56" class="phase-label">PROCESS 3 · DATA INPUT</text>
      <line x1="372" y1="64" x2="372" y2="280" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="976" y1="64" x2="976" y2="280" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- Connectors first (z-order), then labels, then nodes -->
      <path d="M96 120 H120" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <path d="M224 120 H248" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <path d="M352 120 H392" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <path d="M496 120 H516" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <path d="M580 120 H616" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <path d="M548 148 V200" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <path d="M600 224 H660 Q668 224 668 216 V144" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <path d="M720 120 H740" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <path d="M804 120 H856" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <path d="M772 148 V200" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <path d="M960 120 H992" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <path d="M1096 120 H1120" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>

      <!-- Branch labels (masked, 6-10px off the stroke) -->
      <rect x="586" y="100" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="598" y="109" class="arrow-label">YES</text>
      <rect x="556" y="164" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="173" class="arrow-label focal-text">NO</text>
      <rect x="810" y="100" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="830" y="109" class="arrow-label">ACCEPT</text>
      <rect x="780" y="164" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="800" y="173" class="arrow-label">REJECT</text>

      <!-- Process 1: Start, fetch, save -->
      <rect x="40" y="104" width="56" height="32" rx="16" fill="#f5f5f5" stroke="#2d3142"/>
      <text x="68" y="124" class="terminal-text">Start</text>

      <rect x="120" y="96" width="104" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="96" width="104" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
      <rect x="124" y="100" width="28" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="138" y="107" class="tag-text">MAIL</text>
      <text x="172" y="122" class="node-title">Fetch new emails</text>
      <text x="172" y="134" class="node-sub">shared mailbox</text>

      <rect x="248" y="96" width="104" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="96" width="104" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
      <rect x="252" y="100" width="28" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="266" y="107" class="tag-text">MAIL</text>
      <text x="300" y="122" class="node-title">Save attachments</text>
      <text x="300" y="134" class="node-sub">pdf → work folder</text>

      <!-- Process 2: classify, confidence gate, human validation, extract, accept gate -->
      <rect x="392" y="96" width="104" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="392" y="96" width="104" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
      <rect x="396" y="100" width="28" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="410" y="107" class="tag-text">DOC AI</text>
      <text x="444" y="122" class="node-title">Digitize &amp; classify</text>
      <text x="444" y="134" class="node-sub">document model</text>

      <path d="M548 92 L580 120 L548 148 L516 120 Z" fill="#f5f5f5" stroke="#4f5d75"/>
      <text x="548" y="115" class="decision-text">Conf.</text>
      <text x="548" y="127" class="decision-text">≥ 85%?</text>

      <rect x="496" y="200" width="104" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="200" width="104" height="48" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="500" y="204" width="28" height="10" rx="3" fill="rgba(235,108,54,0.20)"/><text x="514" y="211" class="tag-text focal-text">HUMAN</text>
      <text x="548" y="226" class="node-title">Human validation</text>
      <text x="548" y="238" class="node-sub">task inbox · review</text>

      <rect x="616" y="96" width="104" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="96" width="104" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
      <rect x="620" y="100" width="28" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="634" y="107" class="tag-text">DOC AI</text>
      <text x="668" y="122" class="node-title">Extract fields</text>
      <text x="668" y="134" class="node-sub">fields · confidence</text>

      <path d="M772 92 L804 120 L772 148 L740 120 Z" fill="#f5f5f5" stroke="#4f5d75"/>
      <text x="772" y="123" class="decision-text">Accept?</text>

      <rect x="744" y="200" width="56" height="32" rx="16" fill="#f5f5f5" stroke="#2d3142"/>
      <text x="772" y="220" class="terminal-text">End</text>

      <!-- Queue bridge at the producing edge of Process 2 -->
      <rect x="856" y="96" width="104" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="96" width="104" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
      <rect x="860" y="100" width="28" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="874" y="107" class="tag-text">QUEUE</text>
      <text x="908" y="122" class="node-title">Extracted data</text>
      <text x="908" y="134" class="node-sub">queue · 84 items</text>

      <!-- Process 3: post + end -->
      <rect x="992" y="96" width="104" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="992" y="96" width="104" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
      <rect x="996" y="100" width="28" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="1010" y="107" class="tag-text">APP</text>
      <text x="1044" y="122" class="node-title">Post form data</text>
      <text x="1044" y="134" class="node-sub">submission form</text>

      <rect x="1120" y="104" width="56" height="32" rx="16" fill="#f5f5f5" stroke="#2d3142"/>
      <text x="1148" y="124" class="terminal-text">End</text>

      <!-- Legend -->
      <line x1="40" y1="300" x2="1160" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="320" class="legend-label">LEGEND</text>
      <rect x="120" y="308" width="32" height="14" rx="7" fill="#f5f5f5" stroke="#2d3142"/><text x="160" y="318" class="legend-text">Start / End</text>
      <rect x="240" y="306" width="28" height="16" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/><text x="276" y="318" class="legend-text">Activity · tag names the executing system</text>
      <path d="M480 306 L492 314 L480 322 L468 314 Z" fill="#f5f5f5" stroke="#4f5d75"/><text x="500" y="318" class="legend-text">Decision · every exit labeled</text>
      <rect x="644" y="306" width="28" height="16" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="680" y="318" class="legend-text">Queue · decoupling point</text>
      <rect x="808" y="306" width="28" height="16" rx="3" fill="rgba(235,108,54,0.07)" stroke="#eb6c36"/><text x="844" y="318" class="legend-text">Human validation (focal)</text>
    </svg>
  </main>
</body>
</html>
