<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High-level architecture · End-to-end stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1e1e1e;
      --color-ink:    #f6f6f6;
      --color-muted:  #c1c8d1;
      --color-accent: #82ffcf;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Automation Design</p>
    <h1>High-level architecture · End-to-end stack</h1>

    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="high-level-dark-title high-level-dark-desc">
      <title id="high-level-dark-title">High-level architecture · End-to-end stack</title>
      <desc id="high-level-dark-desc">Architecture diagram showing data sources moving through Apache NiFi and MinIO into Trino, data modeling, and Superset dashboards, with Airflow orchestration.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(246,246,246,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#c1c8d1"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#82ffcf"/>
        </marker>
        <marker id="arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
          <polygon points="0 0, 6 2.5, 0 5" fill="#c1c8d1"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#1e1e1e"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Phase chevron banner -->

      <polygon points="400,4 588,4 600,18 588,32 400,32 412,18" fill="#4a5464"/>
      <polygon points="600,4 788,4 800,18 788,32 600,32 612,18" fill="#272727"/>
      <polygon points="800,4 1000,4 1000,32 800,32 812,18" fill="#4a5464"/>

      <text x="300" y="21" fill="#f6f6f6" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">INGESTION</text>
      <text x="500" y="21" fill="#f6f6f6" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">STORAGE</text>
      <text x="700" y="21" fill="#f6f6f6" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.13em" text-anchor="middle">TRANSFORMATION &amp; ANALYSIS</text>
      <text x="900" y="21" fill="#f6f6f6" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">VISUALIZATION</text>

      <line x1="144" y1="172" x2="160" y2="172" stroke="#c1c8d1" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="144" y1="252" x2="160" y2="252" stroke="#c1c8d1" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="144" y1="336" x2="160" y2="336" stroke="#c1c8d1" stroke-width="1" marker-end="url(#arrow)"/>

      <line x1="682" y1="96" x2="682" y2="144" stroke="#c1c8d1" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-sm)"/>
      <line x1="896" y1="96" x2="896" y2="144" stroke="#c1c8d1" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-sm)"/>
      <path d="M 328,152 H 344 Q 348,152 348,148 V 144 Q 348,140 352,140 H 372" fill="none" stroke="#c1c8d1" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 328,168 H 344 Q 352,168 352,176 V 240 Q 352,248 372,248" fill="none" stroke="#82ffcf" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <text x="78" y="262" fill="#f6f6f6" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DB Connection</text>
      <text x="78" y="274" fill="#c1c8d1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CDC · SQL · API</text>

      <!-- Legacy System -->

      <rect x="20" y="310" width="22" height="12" rx="2" fill="transparent" stroke="rgba(246,246,246,0.25)" stroke-width="0.8"/>
      <text x="31" y="319" fill="rgba(246,246,246,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="78" y="346" fill="#f6f6f6" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Legacy System</text>
      <text x="78" y="358" fill="#c1c8d1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Trade data</text>

      <!-- Airflow bar -->

      <text x="564" y="71" fill="#f6f6f6" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orchestration / Workflow Automation</text>
      <text x="564" y="84" fill="#c1c8d1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">(Apache Airflow)</text>

      <!-- NiFi -->
      <rect x="176" y="112" width="152" height="80" rx="6" fill="rgba(246,246,246,0.06)" stroke="rgba(246,246,246,0.20)" stroke-width="1"/>

      <!-- Trino -->

      <text x="452" y="146" fill="#f6f6f6" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trino</text>
      <text x="452" y="158" fill="#c1c8d1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SQL · data virtualization</text>

      <!-- MinIO (FOCAL) -->
      <rect x="372" y="208" width="160" height="80" rx="8" fill="rgba(130,255,207,0.12)" stroke="#82ffcf" stroke-width="1.2"/>

      <!-- Data Modeling -->

      <text x="682" y="198" fill="#c1c8d1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Notebook · Python · R</text>

      <!-- Dashboards -->

      <rect x="828" y="150" width="28" height="12" rx="2" fill="transparent" stroke="rgba(246,246,246,0.25)" stroke-width="0.8"/>
      <text x="842" y="159" fill="rgba(246,246,246,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DASH</text>

      <text x="896" y="198" fill="#c1c8d1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Superset · reports</text>

      <!-- Kubernetes label -->
      <text x="204" y="362" fill="#c1c8d1" font-size="8" font-weight="500" font-family="'Geist', sans-serif">Kubernetes</text>

      <!-- Identity Manager -->

      <text x="500" y="422" fill="#c1c8d1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">(Active Directory)</text>

      <!-- Legend -->
      <line x1="40" y1="440" x2="960" y2="440" stroke="rgba(246,246,246,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#c1c8d1" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40"  y="464" width="20" height="12" rx="3" fill="transparent" stroke="rgba(246,246,246,0.30)" stroke-width="1" stroke-dasharray="4,3"/>

      <line x1="808" y1="466" x2="828" y2="466" stroke="rgba(246,246,246,0.35)" stroke-width="1" stroke-dasharray="4,3"/>

  </div>
</body>
</html>
