<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automation Design · Gallery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --paper: #f5f4ed;
        --paper-2: #efeee5;
        --ink: #0b0d0b;
        --muted: #52534e;
        --soft: #65655c;
        --rule: rgba(11, 13, 11, 0.12);
        --rule-strong: rgba(11, 13, 11, 0.25);
        --accent: #f7591f;
        --sans: "Geist", system-ui, sans-serif;
        --serif: "Instrument Serif", serif;
        --mono: "Geist Mono", ui-monospace, monospace;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--sans);
        background: var(--paper);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .topbar {
        padding: 1rem 1.25rem 0.625rem;
        border-bottom: 1px solid var(--rule);
        flex: 0 0 auto;
      }
      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 0.75rem;
        gap: 1rem;
      }
      .title-row h1 {
        font-family: var(--serif);
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1;
      }
      .title-row .meta {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .title-row .open-raw {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.06em;
        color: var(--muted);
        text-decoration: none;
        padding: 0.3rem 0.625rem;
        border: 1px solid var(--rule);
        border-radius: 4px;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .open-raw:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
        margin-bottom: 0.5rem;
      }
      .tabs.variants {
        margin-bottom: 0;
        padding-top: 0.5rem;
        border-top: 1px solid var(--rule);
      }
      .tab {
        font-family: var(--sans);
        font-size: 0.8125rem;
        font-weight: 500;
        padding: 0.375rem 0.75rem;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--rule);
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.12s;
        letter-spacing: -0.005em;
      }
      .tab:hover {
        color: var(--ink);
        border-color: var(--rule-strong);
      }
      .tab:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .tab.active {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--ink);
      }
      .tab .eyebrow {
        display: inline-block;
        margin-right: 0.25rem;
        font-family: var(--mono);
        font-size: 0.56rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: inherit;
        opacity: 0.5;
      }
      .tab.new::after {
        content: "NEW";
        display: inline-block;
        margin-left: 0.35rem;
        font-family: var(--mono);
        font-size: 0.54rem;
        letter-spacing: 0.12em;
        color: var(--accent);
        vertical-align: 1px;
      }
      .tab.active.new::after {
        color: var(--paper);
      }

      main {
        flex: 1 1 auto;
        position: relative;
        background: var(--paper-2);
        overflow: hidden;
      }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--paper);
        display: block;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="title-row">
        <h1>
          Automation Design
          <span
            class="meta"
            style="
              font-family: var(--mono);
              font-size: 0.66rem;
              margin-left: 0.5rem;
            "
            >· gallery</span
          >
        </h1>
        <div style="display: flex; gap: 0.5rem">
          <a class="open-raw" href="icons.html" target="_blank" rel="noopener"
            >icon library ↗</a
          >
          <a
            class="open-raw"
            id="open-raw"
            href="#"
            target="_blank"
            rel="noopener"
            >open in new tab ↗</a
          >
        </div>
      </div>

      <div class="tabs" id="type-tabs" role="radiogroup" aria-label="Diagram type">
        <button class="tab active" data-type="architecture">
          <span class="eyebrow">01</span>Architecture
        </button>
        <button class="tab" data-type="flowchart">
          <span class="eyebrow">02</span>Flowchart
        </button>
        <button class="tab" data-type="sequence">
          <span class="eyebrow">03</span>Sequence
        </button>
        <button class="tab" data-type="state">
          <span class="eyebrow">04</span>State
        </button>
        <button class="tab" data-type="swimlane">
          <span class="eyebrow">05</span>Swimlane
        </button>
        <button class="tab" data-type="org-chart">
          <span class="eyebrow">06</span>Org chart
        </button>
        <button class="tab" data-type="layers">
          <span class="eyebrow">07</span>Layers
        </button>
        <button class="tab" data-type="loop">
          <span class="eyebrow">08</span>Loop
        </button>
        <button class="tab" data-type="process">
          <span class="eyebrow">09</span>Process
        </button>
        <button class="tab" data-type="data-flow">
          <span class="eyebrow">10</span>Data flow
        </button>
        <button class="tab" data-type="it-state">
          <span class="eyebrow">11</span>IT current-state
        </button>
        <button class="tab" data-type="sequence-oauth">
          <span class="eyebrow">12</span>Sequence · OAuth
        </button>
        <button class="tab" data-type="invoice-automation" data-single>
          <span class="eyebrow">13</span>Invoice automation · flagship
        </button>
        <button class="tab" data-type="rpa-blueprint" data-single>
          <span class="eyebrow">13b</span>RPA blueprint · flagship
        </button>
        <button class="tab" data-type="process-detail" data-single>
          <span class="eyebrow">13c</span>Process detail · PDD
        </button>
        <button class="tab" data-type="detail-set-overview" data-single>
          <span class="eyebrow">13d</span>Detail set · overview
        </button>
        <button class="tab" data-type="detail-set-p2-catch-webhook" data-single>
          <span class="eyebrow">13e</span>Detail set · 2.0 page
        </button>
        <button class="tab" data-type="detail-set-p2.2.1-excel-readsheet" data-single>
          <span class="eyebrow">13f</span>Detail set · 2.2.1 sub-routine
        </button>
        <button class="tab" data-type="agent-card" data-single>
          <span class="eyebrow">13g</span>Agent card · autonomous
        </button>
        <button class="tab" data-type="agent-card-conversational" data-single>
          <span class="eyebrow">13h</span>Agent card · conversational
        </button>
        <button class="tab" data-type="import-drawio" data-single>
          <span class="eyebrow">13</span>Import · draw.io
        </button>
        <button class="tab" data-type="import-mermaid" data-single>
          <span class="eyebrow">14</span>Import · Mermaid
        </button>
        <button class="tab" data-type="loop-terminal" data-single>
          <span class="eyebrow">15</span>Loop · terminal
        </button>
        <button class="tab" data-type="policy-trace-animated" data-single>
          <span class="eyebrow">16</span>Policy trace · animated
        </button>
        <button class="tab" data-type="queue-animated" data-single>
          <span class="eyebrow">17</span>Fan-in queue · animated
        </button>
        <button class="tab" data-type="paved-road-animated" data-single>
          <span class="eyebrow">18</span>Secure paved road · animated
        </button>
      </div>

      <div
        class="tabs variants"
        id="variant-tabs"
        role="radiogroup"
        aria-label="Variant"
      >
        <button class="tab active" data-variant="">Minimal light</button>
        <button class="tab" data-variant="-dark">Minimal dark</button>
        <button class="tab" data-variant="-full">Full editorial</button>
      </div>
    </header>

    <main>
      <iframe
        id="preview"
        src="example-architecture.html"
        title="Preview"
      ></iframe>
    </main>

    <script>
      const state = { type: "architecture", variant: "" };
      const iframe = document.getElementById("preview");
      const openRaw = document.getElementById("open-raw");

      function update() {
        const activeType = [...document.querySelectorAll("#type-tabs .tab")].find(
          (tab) => tab.dataset.type === state.type,
        );
        const single = activeType && activeType.hasAttribute("data-single");
        const variantTabs = document.querySelectorAll("#variant-tabs .tab");
        if (single) state.variant = "";
        variantTabs.forEach((tab) => {
          tab.disabled = single && tab.dataset.variant !== "";
        });
        for (const [containerId, key] of [
          ["type-tabs", "type"],
          ["variant-tabs", "variant"],
        ]) {
          document.querySelectorAll(`#${containerId} .tab`).forEach((tab) => {
            const active = tab.dataset[key] === state[key];
            tab.classList.toggle("active", active);
            tab.setAttribute("aria-checked", String(active));
            tab.tabIndex = active ? 0 : -1;
          });
        }
        const src = `example-${state.type}${state.variant}.html`;
        iframe.src = src;
        openRaw.href = src;
        const selectedTabs = document.querySelectorAll('[role="radio"][aria-checked="true"]');
        iframe.setAttribute(
          "aria-labelledby",
          [...selectedTabs].map((tab) => tab.id).join(" "),
        );
      }

      function bindTabs(containerId, key) {
        const container = document.getElementById(containerId);
        const tabs = [...container.querySelectorAll(".tab")];
        tabs.forEach((tab, index) => {
          tab.id = `${containerId}-${index}`;
          tab.setAttribute("role", "radio");
          tab.setAttribute("aria-controls", "preview");
        });

        function activate(tab, focus = false) {
          state[key] = tab.dataset[key];
          update();
          if (focus) tab.focus();
        }

        container.addEventListener("click", (e) => {
          const btn = e.target.closest(".tab");
          if (!btn) return;
          activate(btn);
        });
        container.addEventListener("keydown", (e) => {
          const current = e.target.closest('[role="radio"]');
          if (!current || !container.contains(current)) return;
          const enabledTabs = tabs.filter((tab) => !tab.disabled);
          const index = enabledTabs.indexOf(current);
          let next;
          if (e.key === "ArrowRight" || e.key === "ArrowDown") {
            next = enabledTabs[(index + 1) % enabledTabs.length];
          }
          if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
            next = enabledTabs[(index - 1 + enabledTabs.length) % enabledTabs.length];
          }
          if (e.key === "Home") next = enabledTabs[0];
          if (e.key === "End") next = enabledTabs.at(-1);
          if (!next) return;
          e.preventDefault();
          activate(next, true);
        });
      }

      bindTabs("type-tabs", "type");
      bindTabs("variant-tabs", "variant");
      update();
    </script>
  </body>
</html>
