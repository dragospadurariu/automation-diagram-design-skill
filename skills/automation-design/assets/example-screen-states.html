<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screen states · State machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #7a8399; --rule: rgba(45,49,66,0.12); --accent: #eb6c36; --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1120px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; font: 400 2rem/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; }
    .tag-text { fill: var(--muted); font: 600 6px var(--mono); text-anchor: middle; letter-spacing: 0.06em; }
    .node-title { fill: var(--ink); font: 600 10px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; letter-spacing: 0.06em; }
    .focal-text { fill: var(--accent); }
    .legend-label { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
    .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
    .colophon { margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--rule); color: var(--soft); font: 400 0.62rem var(--mono); letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">State machine · screen states · Automation Design</p>
    <h1>Invoice Portal — screen states</h1>

    <svg viewBox="0 0 1120 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="screen-states-title screen-states-desc">
      <title id="screen-states-title">Invoice Portal — screen states</title>
      <desc id="screen-states-desc">Screens as states, clicks as events, roles as guards: sign-in via the identity provider enters the invoice list; selecting a row opens the detail state; approve opens a transient confirmation whose confirm event queues the posting command and returns to the list; edit and admin settings both return to where they came from.</desc>
      <defs>
        <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#eb6c36"/></marker>
      </defs>
      <rect width="1120" height="400" fill="#f5f5f5"/>

      <!-- Connectors first -->
      <!-- initial -> list -->
      <path d="M72 160 H120" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <!-- list -> detail -->
      <path d="M256 160 H344" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <!-- detail -> confirmation (focal event) -->
      <path d="M480 160 H568" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <!-- confirmation -> back to list (top return) -->
      <path d="M656 136 V112 Q656 104 648 104 H196 Q188 104 188 112 V136" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <!-- detail <-> edit modal -->
      <path d="M384 184 V264" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <path d="M440 264 V184" fill="none" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#arr)"/>
      <!-- confirmation -> back to detail (cancel) -->
      <path d="M612 184 V224 Q612 232 604 232 H472 Q464 232 464 224 V184" fill="none" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#arr)"/>
      <!-- list <-> admin settings -->
      <path d="M152 184 V264" fill="none" stroke="#4f5d75" marker-end="url(#arr)"/>
      <path d="M224 264 V184" fill="none" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#arr)"/>

      <!-- Transition labels -->
      <rect x="64" y="116" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="112" y="125" class="arrow-label">SIGN IN · IDP</text>
      <rect x="264" y="140" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="149" class="arrow-label">SELECT ROW</text>
      <rect x="492" y="140" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="149" class="arrow-label focal-text">APPROVE</text>
      <rect x="384" y="84" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="93" class="arrow-label">ACK QUEUED</text>
      <rect x="392" y="212" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="221" class="arrow-label">EDIT</text>
      <rect x="448" y="240" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="468" y="249" class="arrow-label">SAVE</text>
      <rect x="44" y="212" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="92" y="221" class="arrow-label">OPEN [ADMIN]</text>
      <rect x="232" y="212" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="252" y="221" class="arrow-label">BACK</text>
      <rect x="516" y="212" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="544" y="221" class="arrow-label">CANCEL</text>

      <!-- Initial state -->
      <circle cx="64" cy="160" r="5" fill="#2d3142"/>

      <!-- Invoice list (state) -->
      <rect x="120" y="136" width="136" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
      <rect x="124" y="140" width="36" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="142" y="147" class="tag-text">SCREEN</text><rect x="216" y="140" width="24" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="228" y="147" class="tag-text">2.0</text>
      <text x="188" y="160" class="node-title">Invoice list</text>
      <text x="188" y="172" class="node-sub">Invoices · status = pending</text>

      <!-- Invoice detail (focal state — the job happens here) -->
      <rect x="344" y="136" width="136" height="48" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="348" y="140" width="36" height="10" rx="3" fill="rgba(235,108,54,0.20)"/><text x="366" y="147" class="tag-text focal-text">SCREEN</text><rect x="440" y="140" width="24" height="10" rx="3" fill="rgba(235,108,54,0.20)"/><text x="452" y="147" class="tag-text focal-text">2.1</text>
      <text x="412" y="160" class="node-title">Invoice detail</text>
      <text x="412" y="172" class="node-sub">lines · attachments · history</text>

      <!-- Approve confirmation (transient state) -->
      <rect x="568" y="136" width="176" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-dasharray="4,3"/>
      <rect x="572" y="140" width="36" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="590" y="147" class="tag-text">MODAL</text>
      <text x="656" y="160" class="node-title">Approve confirmation</text>
      <text x="656" y="172" class="node-sub">confirm [auth] / enqueue · fail stays</text>

      <!-- Edit modal (transient state) -->
      <rect x="344" y="264" width="136" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-dasharray="4,3"/>
      <rect x="348" y="268" width="36" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="366" y="275" class="tag-text">MODAL</text>
      <text x="412" y="288" class="node-title">Edit invoice</text>
      <text x="412" y="300" class="node-sub">validation · required fields</text>

      <!-- Admin settings (role-gated state) -->
      <rect x="120" y="264" width="136" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
      <rect x="124" y="268" width="36" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="142" y="275" class="tag-text">SCREEN</text><rect x="216" y="268" width="24" height="10" rx="3" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/><text x="228" y="275" class="tag-text">2.2</text>
      <text x="188" y="288" class="node-title">Admin settings</text>
      <text x="188" y="300" class="node-sub">thresholds · routing rules</text>

      <!-- Legend -->
      <line x1="40" y1="344" x2="1080" y2="344" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="364" class="legend-label">LEGEND</text>
      <circle cx="128" cy="358" r="4" fill="#2d3142"/><text x="140" y="362" class="legend-text">Initial state (after IdP sign-in)</text>
      <rect x="296" y="350" width="28" height="16" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/><text x="332" y="362" class="legend-text">Screen = state · sublabel = data binding</text>
      <rect x="516" y="350" width="28" height="16" rx="3" fill="rgba(235,108,54,0.07)" stroke="#eb6c36"/><text x="552" y="362" class="legend-text">Focal state (the job)</text>
      <rect x="676" y="350" width="28" height="16" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-dasharray="4,3"/><text x="712" y="362" class="legend-text">Transient (modal)</text>
      <line x1="828" y1="358" x2="868" y2="358" stroke="#4f5d75" stroke-dasharray="5,4"/><text x="876" y="362" class="legend-text">Return · label = EVENT [GUARD]</text>
    </svg>

    <p class="colophon">screen states · screens as states, events as transitions, roles as guards</p>
  </main>
</body>
</html>
